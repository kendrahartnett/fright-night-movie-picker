<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Choose a horror movie for your next fright night."
    />
    <title>Fright Night Movie Picker</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Creepster&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="tmdb-attribution.css" />
    <link rel="stylesheet" href="stage8.css" />
  </head>
  <body>
    <div class="popcorn-field" aria-hidden="true">
      <img class="popcorn popcorn-one" src="assets/popcorn-kernel.png" alt="" />
      <img class="popcorn popcorn-two" src="assets/popcorn-kernel.png" alt="" />
      <img class="popcorn popcorn-three" src="assets/popcorn-kernel.png" alt="" />
      <img class="popcorn popcorn-four" src="assets/popcorn-kernel.png" alt="" />
      <img class="popcorn popcorn-five" src="assets/popcorn-kernel.png" alt="" />
      <img class="popcorn popcorn-six" src="assets/popcorn-kernel.png" alt="" />
      <img class="popcorn popcorn-seven" src="assets/popcorn-kernel.png" alt="" />
      <img class="popcorn popcorn-eight" src="assets/popcorn-kernel.png" alt="" />
      <img class="popcorn popcorn-nine" src="assets/popcorn-kernel.png" alt="" />
      <img class="popcorn popcorn-ten" src="assets/popcorn-kernel.png" alt="" />
    </div>
    <main class="page-shell">
      <section class="picker-card" aria-labelledby="page-title">
        <div class="card-noise" aria-hidden="true"></div>
        <p class="eyebrow"><span>✦</span> Tonight's viewing ritual</p>
        <h1 id="page-title"><span class="title-line title-top">Fright Night</span><span class="title-line title-bottom">Movie Picker</span></h1>
        <p class="intro">
          Tell us the kind of scare you’re craving—or leave fate to the shadows.
        </p>

        <form class="preference-form">
          <fieldset>
            <legend>How far into the dark do you want to go?</legend>
            <div class="choice-grid" role="radiogroup" aria-label="Scare level">
              <label><input type="radio" name="scare-level" value="mild" /><span>Mild</span></label>
              <label><input type="radio" name="scare-level" value="creepy" /><span>Creepy</span></label>
              <label><input type="radio" name="scare-level" value="terrifying" /><span>Terrifying</span></label>
              <label><input type="radio" name="scare-level" value="surprise" checked /><span>Surprise Me</span></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>What kind of horror?</legend>
            <div class="choice-grid" role="radiogroup" aria-label="Horror style">
              <label><input type="radio" name="horror-style" value="supernatural" /><span>Supernatural</span></label>
              <label><input type="radio" name="horror-style" value="slasher" /><span>Slasher</span></label>
              <label><input type="radio" name="horror-style" value="psychological" /><span>Psychological</span></label>
              <label><input type="radio" name="horror-style" value="thriller" /><span>Thriller</span></label>
              <label><input type="radio" name="horror-style" value="surprise" checked /><span>Surprise Me</span></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Pick an era</legend>
            <div class="choice-grid era-grid" role="radiogroup" aria-label="Movie era">
              <label><input type="radio" name="movie-era" value="classic" /><span>Classic</span></label>
              <label><input type="radio" name="movie-era" value="80s-90s" /><span>80s–90s</span></label>
              <label><input type="radio" name="movie-era" value="modern" /><span>Modern</span></label>
              <label><input type="radio" name="movie-era" value="any" checked /><span>Any Era</span></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>The Movie Database rating</legend>
            <div class="choice-grid" role="radiogroup" aria-label="The Movie Database rating">
              <label><input type="radio" name="tmdb-rating" value="0-5" /><span>0–5</span></label>
              <label><input type="radio" name="tmdb-rating" value="6-7" /><span>6–7</span></label>
              <label><input type="radio" name="tmdb-rating" value="8-10" /><span>8–10</span></label>
              <label><input type="radio" name="tmdb-rating" value="surprise" checked /><span>Surprise Me</span></label>
            </div>
          </fieldset>

          <div class="actions">
            <button class="primary-button" type="button" id="pick-movie-button">Pick My Scary Movie</button>
            <button class="secondary-button" type="button" id="just-scare-button">Just Scare Me</button>
          </div>
          <p class="status-message" id="movie-result" aria-live="polite" hidden>
            <span id="movie-result-text"></span>
          </p>
        </form>
      </section>
    </main>
    <footer class="tmdb-attribution">* Ratings and movie data provided by <a href="https://www.themoviedb.org/" target="_blank" rel="noreferrer">The Movie Database</a>.</footer>
    <script src="script.js"></script>
  </body>
</html>
